[project]
name = "job-tracker"
version = "0.1.0"
description = "Job application tracker"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.poetry]
packages = [{ include = "src" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
